<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidieth Crypto AI</title>
</head>

<body>

    <h1>🤖 Sidieth Crypto AI</h1>

    <p>Welcome to your AI assistant.</p>

    <input
        id="message"
        type="text"
        placeholder="Ask anything about crypto..."
    >

    <button type="button" onclick="askAI()">Send</button>

    <p id="status"></p>
    <pre id="reply"></pre>

    <script>
        async function askAI() {

            const message = document.getElementById("message").value;
            const status = document.getElementById("status");
            const reply = document.getElementById("reply");

            if (!message.trim()) {
                status.innerText = "Please enter a question.";
                return;
            }

            status.innerText = "Thinking...";
            reply.innerText = "";

            try {

                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: message
                    })
                });

                const data = await response.json();

                if (data.reply) {
                    status.innerText = "Done";
                    reply.innerText = data.reply;
                } else {
                    status.innerText = "Error";
                    reply.innerText = JSON.stringify(data);
                }

            } catch (error) {

                status.innerText = "Connection error";
                reply.innerText = error.toString();

            }
        }
    </script>

</body>
</html>
